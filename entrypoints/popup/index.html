<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Perfect Prime</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main>
      <h1 data-i18n="manifest_name">Perfect Prime</h1>
      <form id="options">
        <label><input type="checkbox" data-option="skipTitleSequence" /><span data-i18n="skipTitleSequences">Skip Title Sequences</span></label>
        <label><input type="checkbox" data-option="skipRecap" /><span data-i18n="skipRecaps">Skip Recaps</span></label>
        <label><input type="checkbox" data-option="skipAds" /><span data-i18n="skipAds">Skip Ads</span></label>
        <label><input type="checkbox" data-option="autoPlayNext" /><span data-i18n="autoPlayNext">Automatically Play Next Episode</span></label>
        <label><input type="checkbox" data-option="watchCredits" /><span data-i18n="alwaysWatchCredits">Always Watch Credits</span></label>
      </form>
      <footer>
        <a data-url="https://github.com/jonluca/Perfect-Prime" data-i18n="sourceCode">Source Code</a>
        <button id="contrast" type="button" data-i18n="highContrast">High Contrast Mode</button>
        <a data-url="https://chromewebstore.google.com/detail/hdadmgabliibighlbejhlglfjgplfmhb">Netflix version</a>
      </footer>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
